name: Windows EXE + GitHub Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip

      - name: Verify release version
        shell: pwsh
        run: |
          $version = (Get-Content VERSION.txt -Raw).Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'Invalid VERSION.txt' }
          if (!(Select-String -Path kf2_randomizer.py -Pattern "VERSION = `"$version`"" -SimpleMatch)) { throw 'App version differs from VERSION.txt' }
          Write-Host "Building v$version"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt "pyinstaller>=6.11,<7"

      - name: Run regression and desktop GUI tests
        run: |
          python -m py_compile kf2_randomizer.py update_service.py weapons_data.py ui_icons.py
          python -m unittest discover -s tests -v
          python tests/qt_smoke.py

      - name: Build the Windows desktop application
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --onefile --windowed --clean --name 'KF2-Randomizer' --icon 'assets/kf2.ico' kf2_randomizer.py
          if (!(Test-Path 'dist/KF2-Randomizer.exe')) { throw 'PyInstaller did not produce a Windows EXE' }
          $hash = (Get-FileHash 'dist/KF2-Randomizer.exe' -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  KF2-Randomizer.exe" | Set-Content 'dist/KF2-Randomizer.exe.sha256' -Encoding ascii

      - name: Upload Windows EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: KF2-Randomizer-Windows-x64
          path: |
            dist/KF2-Randomizer.exe
            dist/KF2-Randomizer.exe.sha256
          if-no-files-found: error

      - name: Publish new version to GitHub Releases
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content VERSION.txt -Raw).Trim()
          $tag = "v$version"
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $tag already exists, leaving it unchanged."
            exit 0
          }
          gh release create $tag 'dist/KF2-Randomizer.exe' 'dist/KF2-Randomizer.exe.sha256' `
            --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA `
            --title "KF2 Randomizer $tag" --notes-file 'RELEASE_NOTES.md' --latest
          if ($LASTEXITCODE -ne 0) { throw "Could not create release $tag" }